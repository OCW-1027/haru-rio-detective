  const bgmKey = WEA_STORY[idx].bgm || 'mystery';
  playBGM(bgmKey);
  renderWea();
}

function renderWea() {
  const c = WEA_STORY[WeaState.caseIdx];

  // ===== 상단 STAGE 갱신 =====
  const stageBg = document.getElementById('weaStageBg');
  const stageProg = document.getElementById('weaStageProgress');
  const stageChars = document.getElementById('weaStageChars');

  // 배경: 항상 사건 일러스트
  if (stageBg && c.illustration) {
    stageBg.style.backgroundImage = 'url(' + c.illustration + ')';
  }

  // 진행 dot
  if (stageProg) {
    let progHtml = '';
    c.steps.forEach((s, i) => {
      let cls = 'pdot';
      if (i < WeaState.stepIdx) cls += ' done';
      else if (i === WeaState.stepIdx && WeaState.phase === 'step') cls += ' current';
      progHtml += '<div class="' + cls + '">' + (i+1) + '</div>';
    });
    let finalCls = 'pdot';
    if (WeaState.phase === 'resolved') finalCls += ' done';
    else if (WeaState.phase === 'final') finalCls += ' current';
    progHtml += '<div class="' + finalCls + '">🔍</div>';
    stageProg.innerHTML = progHtml;
  }

  // 캐릭터 컷인 + 말풍선
  if (stageChars) {
    let charsHtml = '';
    let currentLine = null;

    if (WeaState.phase === 'intro') {
      currentLine = c.intro[WeaState.introIdx];
    } else if (WeaState.phase === 'step' && WeaState.stepPhase === 'intro') {
      const step = c.steps[WeaState.stepIdx];
      if (step && step.intro) currentLine = step.intro[WeaState.stepIntroIdx];
    }

    // 위치 결정 함수 (대화 중인 사람 위치)
    let charLayout = []; // [{key, pos: 'left'|'right'|'center', state: 'speaking'|'dimmed'|''}]

    if (currentLine) {
      const speaker = currentLine.charKey;
      const cls = currentLine.cls || '';
      // v39: 스토리 방식 - 말하는 사람만 등장 (다른 캐릭터는 화면에서 사라짐)
      if (speaker === 'haru') {
        charLayout.push({ key: 'haru', pos: 'left', state: '' });
      } else if (speaker === 'rio') {
        charLayout.push({ key: 'rio', pos: 'right', state: '' });
      } else if (speaker && SCI_CHARS[speaker]) {
        // 박사·용의자가 중앙
        charLayout.push({ key: speaker, pos: 'center', state: '' });
      }
      // 나레이터의 경우는 캐릭터 없이 자막만 표시
    } else if (WeaState.phase === 'step' && WeaState.stepPhase === 'puzzle') {
      // 퍼즐 풀이 중 - ハル·リオ 둘 다 (생각하는 모습)
      charLayout.push({ key: 'haru', pos: 'left', state: '' });
      charLayout.push({ key: 'rio', pos: 'right', state: '' });
    } else if (WeaState.phase === 'step' && WeaState.stepPhase === 'clue') {
      // 단서 발견 - 둘 다 기뻐
      charLayout.push({ key: 'haru', pos: 'left', state: '' });
      charLayout.push({ key: 'rio', pos: 'right', state: '' });
    } else if (WeaState.phase === 'final') {
      // 최종 추리 - ハル·リオ가 함께
      charLayout.push({ key: 'haru', pos: 'left', state: '' });
      charLayout.push({ key: 'rio', pos: 'right', state: '' });
    } else if (WeaState.phase === 'resolved') {
      // 사건 해결 - 둘 다 환호
      charLayout.push({ key: 'haru', pos: 'left', state: '' });
      charLayout.push({ key: 'rio', pos: 'right', state: '' });
    }

    // 캐릭터 그리기 (말풍선 없이 - 대사는 하단 박스에 표시됨)
    charLayout.forEach(c => {
      if (!SCI_CHARS[c.key]) return;
      charsHtml += '<div class="sci-char ' + c.pos + ' ' + c.state + '" style="background-image:url(' + SCI_CHARS[c.key] + ');"></div>';
    });

    // v41: 음성 재생만 (말풍선 표시는 제거 - 하단 박스에서 텍스트 표시)
    if (currentLine) {
      try { speakLine(currentLine); } catch(e) {}
    }

    stageChars.innerHTML = charsHtml;
  }

  // ===== 하단 AREA 갱신 =====
  const area = document.getElementById('weaArea');
  let html = '';

  // 사건 제목 미니 헤더
  html += '<div style="font-family:RocknRoll One;font-size:13px;color:#1a4a5a;margin-bottom:8px;text-align:center;">';
  html += c.icon + ' 第' + c.id + '事件: ' + escapeHtml(c.title);
  html += '</div>';

  if (WeaState.phase === 'intro') {
    // v41: 기존 스토리 풍 대사 박스 (위는 캐릭터, 아래는 대사)
    const line = c.intro[WeaState.introIdx];
    const cls = line.cls || 'haru';
    html += '<div class="sci-dialogue" id="weaDialogue">';
    html += '<span class="speaker-bubble ' + cls + '">' + escapeHtml(line.speaker) + '</span>';
    html += '<div class="dialogue-content">' + escapeHtml(line.text) + '</div>';
    if (WeaState.introIdx < c.intro.length - 1) {
      html += '<span class="tap-hint">▼ タップ</span>';
    } else {
      html += '<button class="sci-next-btn" id="weaNext" style="margin-top:14px;">🔍 捜査 開始!</button>';
    }
    html += '</div>';
  }
  else if (WeaState.phase === 'step') {
    const step = c.steps[WeaState.stepIdx];
    if (WeaState.stepPhase === 'intro') {
      const line = (step.intro || [])[WeaState.stepIntroIdx];
      if (line) {
        const cls = line.cls || 'haru';
        html += '<div style="font-family:RocknRoll One;font-size:14px;color:#8a6a2a;margin-bottom:6px;text-align:center;">' + escapeHtml(step.title) + '</div>';
        html += '<div class="sci-dialogue" id="weaDialogue">';
        html += '<span class="speaker-bubble ' + cls + '">' + escapeHtml(line.speaker) + '</span>';
        html += '<div class="dialogue-content">' + escapeHtml(line.text) + '</div>';
        if (WeaState.stepIntroIdx < (step.intro || []).length - 1) {
          html += '<span class="tap-hint">▼ タップ</span>';
        } else {
          html += '<button class="sci-next-btn" id="weaNext" style="margin-top:10px;">問題に 進む →</button>';
        }
        html += '</div>';
      }
    }
    else if (WeaState.stepPhase === 'puzzle') {
      // 단서 패널
      if (WeaState.collectedClues.length > 0) {
        html += '<div class="sci-notes-panel">';
        html += '<div class="sci-notes-h">📓 捜査ノート (' + WeaState.collectedClues.length + '件)</div>';
        WeaState.collectedClues.forEach(cl => {
          html += '<div class="sci-notes-item"><strong>' + escapeHtml(cl.title) + ':</strong> ' + escapeHtml(cl.desc) + '</div>';
        });
        html += '</div>';
      }
      html += '<div style="font-family:RocknRoll One;font-size:14px;color:#8a6a2a;margin-bottom:6px;">' + escapeHtml(step.title) + '</div>';
      html += '<div class="sci-puzzle-card">';
      html += '<div class="sci-puzzle-prompt">' + escapeHtml(step.puzzle.prompt) + '</div>';
      html += '<div class="sci-puzzle-options">';
      step.puzzle.options.forEach((opt, i) => {
        html += '<div class="sci-puzzle-opt" data-i="' + i + '">' + (i+1) + '. ' + escapeHtml(opt) + '</div>';
      });
      html += '</div>';
      html += '<button class="sci-hint-toggle" id="weaHintBtn">' + (WeaState.hintShown ? '💡 ヒントを 隠す' : '💡 ヒントを 見る') + '</button>';
      html += '<div class="sci-puzzle-hint' + (WeaState.hintShown ? ' show' : '') + '" id="weaHint">';
      html += '💡 ' + escapeHtml(step.puzzle.hint);
      html += '</div>';
      html += '</div>';
      html += '<div id="weaFeedback"></div>';
    }
    else if (WeaState.stepPhase === 'clue') {
      html += '<div class="sci-clue-note">';
      html += '<div class="sci-clue-h">📓 新しい 手がかりを 発見!</div>';
      html += '<div class="sci-clue-text"><strong>' + escapeHtml(step.clue.title) + ':</strong> ' + escapeHtml(step.clue.desc) + '</div>';
      html += '</div>';
      const isLastStep = WeaState.stepIdx >= c.steps.length - 1;
      html += '<button class="sci-next-btn" id="weaNext">' + (isLastStep ? '🔍 容疑者の 確認 →' : '次の STEP →') + '</button>';
    }
  }
  else if (WeaState.phase === 'final') {
    html += '<div class="sci-notes-panel">';
    html += '<div class="sci-notes-h">📓 捜査ノート 全件</div>';
    WeaState.collectedClues.forEach(cl => {
      html += '<div class="sci-notes-item"><strong>' + escapeHtml(cl.title) + ':</strong> ' + escapeHtml(cl.desc) + '</div>';
    });
    html += '</div>';
    html += '<div class="sci-puzzle-card">';
    html += '<div class="sci-puzzle-prompt">' + escapeHtml(c.finalQ.prompt) + '</div>';
    html += '<div style="font-family:RocknRoll One;font-size:15px;color:#8a6a2a;margin:10px 0 6px;">' + escapeHtml(c.finalQ.question) + '</div>';
    html += '<div class="sci-suspects-grid">';
    c.suspects.forEach(s => {
      const isSelected = WeaState.selectedSuspectId === s.id;
      const isWrong = (WeaState.wrongIds || []).includes(s.id);  // v50: 이미 틀린 용의자
      const wrongStyle = isWrong ? 'border-color:#b85a5a;background:#f5c6c6;opacity:0.55;cursor:not-allowed;' : '';
      html += '<div class="sci-suspect-card' + (isSelected ? ' selected' : '') + (isWrong ? ' tried-wrong' : '') + '" data-id="' + s.id + '" style="' + wrongStyle + '">';
      if (isWrong) {
        html += '<div style="position:absolute;top:8px;right:10px;font-size:22px;color:#b85a5a;font-weight:bold;">✗</div>';
      }
      html += '<div class="sci-suspect-row">';
      if (s.charKey && SCI_CHARS[s.charKey]) {
        html += '<div class="sci-suspect-portrait" style="background-image:url(' + SCI_CHARS[s.charKey] + ');"></div>';
      } else {
        html += '<div class="sci-suspect-icon">' + s.icon + '</div>';
      }
      html += '<div class="sci-suspect-info">';
      html += '<div class="sci-suspect-name">' + escapeHtml(s.name) + '</div>';
      html += '<div class="sci-suspect-role">' + escapeHtml(s.role) + '</div>';
      html += '</div></div>';
      html += '<div class="sci-suspect-detail">';
      html += '<div class="sci-suspect-line"><span class="sci-suspect-key">専門:</span><span>' + escapeHtml(s.specialty) + '</span></div>';
      html += '<div class="sci-suspect-line"><span class="sci-suspect-key">外見:</span><span>' + escapeHtml(s.height + ' / ' + s.clothes) + '</span></div>';
      html += '<div class="sci-suspect-line"><span class="sci-suspect-key">アリバイ:</span><span>' + escapeHtml(s.alibi) + '</span></div>';
      html += '<div class="sci-suspect-line"><span class="sci-suspect-key">証言:</span><span>「' + escapeHtml(s.testimony) + '」</span></div>';
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
    html += '<button class="sci-hint-toggle" id="weaHintBtn">' + (WeaState.hintShown ? '💡 ヒントを 隠す' : '💡 ヒントを 見る') + '</button>';
    html += '<div class="sci-puzzle-hint' + (WeaState.hintShown ? ' show' : '') + '" id="weaHint">';
    html += '💡 ' + escapeHtml(c.finalQ.hint);
    html += '</div>';
    html += '<button class="sci-next-btn" id="weaSubmit"' + (WeaState.selectedSuspectId ? '' : ' disabled style="opacity:0.5;"') + '>🔍 この人物を 推理する!</button>';
    html += '</div>';
    html += '<div id="weaFeedback"></div>';
  }
  else if (WeaState.phase === 'resolved') {
    html += '<div class="sci-resolved">';
    html += '<div class="sci-resolved-title">🏆 事件 解決!</div>';
    html += '<div style="font-family:Klee One;font-size:14px;color:var(--deep-ink);line-height:1.7;white-space:pre-wrap;">' + escapeHtml(c.finalQ.explanation) + '</div>';
    html += '<div class="sci-learned-box">';
    html += '<div class="sci-learned-h">' + escapeHtml(c.learned.title) + '</div>';
    c.learned.points.forEach(p => {
      html += '<div class="sci-learned-item">' + escapeHtml(p) + '</div>';
    });
    html += '</div>';
    html += '</div>';
    const nextIdx = WeaState.caseIdx + 1;
    if (nextIdx < WEA_STORY.length && !WEA_STORY[nextIdx].comingSoon) {
      html += '<button class="sci-next-btn" id="weaGoNext">第' + WEA_STORY[nextIdx].id + '事件 へ →</button>';
    }
    html += '<button class="sci-next-btn" id="weaGoMenu" style="background:#7a4a8a;margin-top:8px;">事件一覧へ</button>';
  }

  area.innerHTML = html;
  bindWeaEvents();
}

function bindWeaEvents() {
  const c = WEA_STORY[WeaState.caseIdx];

  // v41: 대화 진행 - 「sciDialogue」 영역 또는 상단 stage 탭으로 다음 대사
  const advanceDialog = () => {
    if (WeaState.phase === 'intro') {
      if (WeaState.introIdx < c.intro.length - 1) {
        sfx('click');
        WeaState.introIdx++;
        renderWea();
        return true;
      }
    } else if (WeaState.phase === 'step' && WeaState.stepPhase === 'intro') {
      const step = c.steps[WeaState.stepIdx];
      if (WeaState.stepIntroIdx < (step.intro || []).length - 1) {
        sfx('click');
        WeaState.stepIntroIdx++;
        renderWea();
        return true;
      }
    }
    return false;
  };

  // 대사 박스 클릭
  const dlgBox = document.getElementById('weaDialogue');
  if (dlgBox) dlgBox.onclick = advanceDialog;

  // 상단 stage 자체도 탭 가능 (대화 단계일 때만)
  const stage = document.getElementById('weaStage');
  if (stage) {
    stage.onclick = () => {
      if (WeaState.phase === 'intro' ||
          (WeaState.phase === 'step' && WeaState.stepPhase === 'intro')) {
        advanceDialog();
      }
    };
  }

  // 다음 버튼
  const nextBtn = document.getElementById('weaNext');
  if (nextBtn) {
    nextBtn.onclick = () => {
      sfx('click');
      if (WeaState.phase === 'intro') {
        if (WeaState.introIdx < c.intro.length - 1) {
          WeaState.introIdx++;
        } else {
          // 단계로 진입
          WeaState.phase = 'step';
          WeaState.stepIdx = 0;
          WeaState.stepPhase = 'intro';
          WeaState.stepIntroIdx = 0;
          WeaState.hintShown = false;
        }
      } else if (WeaState.phase === 'step') {
        const step = c.steps[WeaState.stepIdx];
        if (WeaState.stepPhase === 'intro') {
          if (WeaState.stepIntroIdx < (step.intro || []).length - 1) {
            WeaState.stepIntroIdx++;
          } else {
            WeaState.stepPhase = 'puzzle';
            WeaState.hintShown = false;
            WeaState.answered = false;
          }
        } else if (WeaState.stepPhase === 'clue') {
          // 다음 단계 또는 최종
          if (WeaState.stepIdx < c.steps.length - 1) {
            WeaState.stepIdx++;
            WeaState.stepPhase = 'intro';
            WeaState.stepIntroIdx = 0;
            WeaState.hintShown = false;
          } else {
            WeaState.phase = 'final';
            WeaState.hintShown = false;
            WeaState.selectedSuspectId = null;
            WeaState.answered = false;  // v50 fix: puzzle에서 set된 answered가 final까지 그대로 와서 용의자 클릭 차단되는 버그 수정
            WeaState.wrongIds = [];  // v50: 새 final 진입 시 wrongIds 리셋
          }
        }
      }
      renderWea();
    };
  }

  // 힌트 토글
  const hintBtn = document.getElementById('weaHintBtn');
  if (hintBtn) {
    hintBtn.onclick = () => {
      WeaState.hintShown = !WeaState.hintShown;
      sfx('click');
      // v70: render() 대신 DOM 직접 조작 (정답 후 피드백·続けるボタン 보존)
      const hintEl = document.getElementById('weaHint');
      if (hintEl) {
        hintEl.classList.toggle('show', WeaState.hintShown);
      }
      hintBtn.textContent = WeaState.hintShown ? '💡 ヒントを 隠す' : '💡 ヒントを 見る';
    };
  }

  // 퍼즐 옵션 (step phase) - v52: 오답 시 정답 자동 노출 X, 누른 옵션만 wrong 처리
  if (WeaState.phase === 'step' && WeaState.stepPhase === 'puzzle') {
    const step = c.steps[WeaState.stepIdx];
    document.querySelectorAll('.sci-puzzle-opt').forEach(opt => {
      opt.onclick = () => {
        if (WeaState.answered) return;
        if (opt.classList.contains('wrong')) return;  // 이미 틀린 옵션은 클릭 불가
        const chosen = parseInt(opt.dataset.i);
        const correct = step.puzzle.answer;
        const ok = chosen === correct;
        const fb = document.getElementById('weaFeedback');

        if (ok) {
          // 정답: 모든 옵션 disabled, 정답에만 correct 표시, explanation 공개
          WeaState.answered = true;
          document.querySelectorAll('.sci-puzzle-opt').forEach((o, i) => {
            o.classList.add('answered');
            if (i === correct) o.classList.add('correct');
          });
          sfx('unlock');
          let fbHtml = '<div class="sci-feedback ok">';
          fbHtml += '<div class="sci-feedback-h ok">🎉 正解!</div>';
          fbHtml += '<div class="sci-feedback-text">' + escapeHtml(step.puzzle.explanation) + '</div>';
          fbHtml += '</div>';
          if (step.clue) WeaState.collectedClues.push(step.clue);
          fbHtml += '<button class="sci-next-btn" id="weaNextOk">続ける →</button>';
          fb.innerHTML = fbHtml;
          setTimeout(() => { fb.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
          const nb = document.getElementById('weaNextOk');
          if (nb) nb.onclick = () => {
            sfx('clue');
            WeaState.stepPhase = 'clue';
            renderWea();
          };
        } else {
          // 오답: 누른 옵션만 wrong, 정답은 절대 표시하지 않음, explanation도 미공개
          opt.classList.add('answered', 'wrong');
          sfx('wrong');
          // 남은 선택지 수
          const remaining = document.querySelectorAll('.sci-puzzle-opt:not(.wrong)').length;
          fb.innerHTML = '<div class="sci-feedback ng">' +
            '<div class="sci-feedback-h ng">✗ 違う…</div>' +
            '<div class="sci-feedback-text">それは 答えでは ない。手がかりを もう一度 考えて、別の 答えを 試そう。残り: ' + remaining + '個</div>' +
            '</div>';
          setTimeout(() => { fb.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
        }
      };
    });
  }

  // 용의자 선택 (final phase)
  if (WeaState.phase === 'final') {
    document.querySelectorAll('.sci-suspect-card').forEach(card => {
      card.onclick = () => {
        if (WeaState.answered) return;
        if ((WeaState.wrongIds || []).includes(card.dataset.id)) return;  // v50: 이미 틀린 용의자는 클릭 불가
        sfx('select');  // v32: 용의자 선택
        WeaState.selectedSuspectId = card.dataset.id;
        renderWea();
      };
    });
    const submitBtn = document.getElementById('weaSubmit');
    if (submitBtn) {
      submitBtn.onclick = () => {
        if (!WeaState.selectedSuspectId) return;
        WeaState.answered = true;
        const ok = WeaState.selectedSuspectId === c.finalQ.answer;
        if (ok) {
          // v50: 정답일 때만 정답 카드 강조
          document.querySelectorAll('.sci-suspect-card').forEach(card => {
            if (card.dataset.id === c.finalQ.answer) {
              card.style.borderColor = '#6ba76b';
              card.style.background = '#c8e6c8';
              card.style.opacity = '1';
            }
          });
          sfx('reveal');  // v32: 모순/진실 발견의 긴장감
          setTimeout(() => sfx('resolved'), 800);  // 그 다음 해결의 환희
          triggerConfetti();
          // 클리어 처리
          State.weaCleared[WeaState.caseIdx] = true;
          saveState();
          setTimeout(() => {
            WeaState.phase = 'resolved';
            renderWea();
          }, 1800);
        } else {
          // v50: 오답이면 정답을 자동으로 알려주지 않고, 그 용의자만 X 처리
          if (!WeaState.wrongIds) WeaState.wrongIds = [];
          if (!WeaState.wrongIds.includes(WeaState.selectedSuspectId)) {
            WeaState.wrongIds.push(WeaState.selectedSuspectId);
          }
          sfx('wrong');
          const fb = document.getElementById('weaFeedback');
          // 남은 용의자 수 계산 (정답 힌트 X)
          const remaining = c.suspects.length - WeaState.wrongIds.length;
          fb.innerHTML = '<div class="sci-feedback ng">' +
            '<div class="sci-feedback-h ng">✗ 違うようだ…</div>' +
            '<div class="sci-feedback-text">この人は 犯人では ない。残り 容疑者: ' + remaining + '名。手がかりを もう一度 見直そう。</div>' +
            '</div>' +
            '<button class="sci-next-btn" id="weaTryAgain" style="background:#b85a5a;">もう一度 推理</button>';
          document.getElementById('weaTryAgain').onclick = () => {
            sfx('click');
            WeaState.answered = false;
            WeaState.selectedSuspectId = null;
            // wrongIds는 유지 (다음 시도 시 X 마크 그대로)
            renderWea();
          };
        }
      };
    }
  }

  // 해결 후 버튼
  const goNext = document.getElementById('weaGoNext');
  if (goNext) {
    goNext.onclick = () => { sfx('click'); startWeaCase(WeaState.caseIdx + 1); };
  }
  const goMenu = document.getElementById('weaGoMenu');
  if (goMenu) {
    goMenu.onclick = () => { sfx('click'); buildChapterGrid(); showPage('pageSelect'); };
  }
}

const WeaLearnState = {
  currentCase: null, // null = 사건 선택 / 1~10 = 해당 사건 학습 중
  quizAnswered: {},  // {caseId: {quizIdx: chosenIdx}}
  cardRevealed: {},  // {caseId: {cardIdx: true}}
};

// 메인 학습 페이지 렌더링
function renderWeaLearn() {

function renderWeaLearnCase(caseId) {
  const learn = WEA_LEARN[caseId];
  const story = WEA_STORY.find(c => c.id === caseId);
  if (!learn || !story) return '<div>学習資料 が ありません。</div>';
  
  let html = `
    <div style="text-align:center;margin-bottom:8px;">
      <button class="wea-learn-entry-btn" id="btnLearnHome" style="background:#888;padding:6px 14px;font-size:12px;">← 事件 一覧</button>
    </div>
    <div class="wea-learn-header">
      <h2>${story.icon} 第${caseId}事件 学習資料</h2>
      <div class="subtitle">${learn.title} - ${learn.subtitle}</div>
      <div class="scope-badge">${learn.examScope}</div>
    </div>
    <div class="wea-learn-content">
  `;
  
  // 1. 概念
  html += `<div class="wea-learn-section"><h3>📖 概念</h3>`;
  learn.concepts.forEach(c => {
    html += `<div class="wea-concept"><div class="term">${c.term}</div><div class="desc">${c.desc}</div></div>`;
  });
  html += `</div>`;
  
  // 2. 다이어그램
  if (learn.diagram) {
    html += `<div class="wea-learn-section"><h3>📊 図解</h3><div class="wea-diagram-wrap">${learn.diagram}</div></div>`;
  }
  
  // 3. 공식
  if (learn.formulas && learn.formulas.length) {
    html += `<div class="wea-learn-section"><h3>📝 頻出公式</h3><div class="wea-formula-list">`;
    learn.formulas.forEach((f, i) => {
      html += `<div class="wea-formula"><div class="num">${i+1}</div><div class="f">${f.f}</div><div class="m">${f.m}</div></div>`;
    });
    html += `</div></div>`;
  }
  
  // 4. 표
  if (learn.table) {
    html += `<div class="wea-learn-section"><h3>📋 ${learn.table.title}</h3><table class="wea-table"><thead><tr>`;
    learn.table.headers.forEach(h => html += `<th>${h}</th>`);
    html += `</tr></thead><tbody>`;
    learn.table.rows.forEach(row => {
      html += `<tr>`;
      row.forEach(cell => html += `<td>${cell}</td>`);
      html += `</tr>`;
    });
    html += `</tbody></table></div>`;
  }
  
  // 5. 暗記카드 (토글)
  if (learn.cards && learn.cards.length) {
    html += `<div class="wea-learn-section"><h3>🎴 暗記カード (タップで 答え 表示)</h3><div class="wea-cards-grid">`;
    const revealed = WeaLearnState.cardRevealed[caseId] || {};
    learn.cards.forEach((card, i) => {
      const isRev = revealed[i];
      html += `
        <div class="wea-card-flip ${isRev ? 'revealed' : ''}" data-case="${caseId}" data-idx="${i}">
          <span class="label">${i+1}/${learn.cards.length}</span>
          <span>${isRev ? '✅ ' + card.a : '❓ ' + card.q}</span>
        </div>
      `;
    });
    html += `</div></div>`;
  }
  
  // 6. 객관식
  if (learn.quiz && learn.quiz.length) {
    html += `<div class="wea-learn-section"><h3>❓ 過去問風 5問</h3>`;
    const ans = WeaLearnState.quizAnswered[caseId] || {};
    learn.quiz.forEach((q, qi) => {
      const chosen = ans[qi];
      const answered = (chosen !== undefined);
      html += `<div class="wea-quiz ${answered ? 'answered' : ''}" data-case="${caseId}" data-qidx="${qi}">
        <div class="q">問${qi+1}: ${q.q}</div>
        <div class="opts">`;
      q.opts.forEach((opt, oi) => {
        let cls = '';
        if (answered) {
          if (oi === q.ans) cls = 'correct';
          else if (oi === chosen) cls = 'wrong';
        }
        html += `<div class="opt ${cls}" data-case="${caseId}" data-qidx="${qi}" data-oidx="${oi}">${String.fromCharCode(65+oi)}) ${opt}</div>`;
      });
      html += `</div><div class="exp">💡 ${q.exp}</div></div>`;
    });
    html += `</div>`;
  }
  
  // 7. Tips
  if (learn.tips && learn.tips.length) {
    html += `<div class="wea-learn-section"><h3>💡 試験対策 Tips</h3><div class="wea-tips"><ul>`;
    learn.tips.forEach(t => html += `<li>${t}</li>`);
    html += `</ul></div></div>`;
  }
  
  html += `</div>`;
  return html;
}

function bindWeaLearnEvents() {
  // 사건 카드 클릭
  document.querySelectorAll('.wea-learn-card').forEach(card => {
    card.onclick = () => {
      sfx('click');
      WeaLearnState.currentCase = parseInt(card.dataset.case);
      renderWeaLearn();
      window.scrollTo(0, 0);
    };
  });
  // 홈 버튼
  const btnHome = document.getElementById('btnLearnHome');
  if (btnHome) btnHome.onclick = () => {
    sfx('click');
    WeaLearnState.currentCase = null;
    renderWeaLearn();
    window.scrollTo(0, 0);
  };
  // 暗記카드 토글
  document.querySelectorAll('.wea-card-flip').forEach(card => {
    card.onclick = () => {
      sfx('click');
      const cid = parseInt(card.dataset.case);
      const idx = parseInt(card.dataset.idx);
      if (!WeaLearnState.cardRevealed[cid]) WeaLearnState.cardRevealed[cid] = {};
      WeaLearnState.cardRevealed[cid][idx] = !WeaLearnState.cardRevealed[cid][idx];
      // 즉시 토글 (전체 재렌더 안함)
      card.classList.toggle('revealed');
      const learn = WEA_LEARN[cid];
      const c = learn.cards[idx];
      const span = card.querySelector('span:not(.label)');
      if (span) {
        span.textContent = WeaLearnState.cardRevealed[cid][idx] ? '✅ ' + c.a : '❓ ' + c.q;
      }
    };
  });
  // 객관식 클릭
  document.querySelectorAll('.wea-quiz .opt').forEach(opt => {
    opt.onclick = () => {
      const cid = parseInt(opt.dataset.case);
      const qi = parseInt(opt.dataset.qidx);
      const oi = parseInt(opt.dataset.oidx);
      if (!WeaLearnState.quizAnswered[cid]) WeaLearnState.quizAnswered[cid] = {};
      if (WeaLearnState.quizAnswered[cid][qi] !== undefined) return; // 이미 답함
      WeaLearnState.quizAnswered[cid][qi] = oi;
      const learn = WEA_LEARN[cid];
      sfx(oi === learn.quiz[qi].ans ? 'correct' : 'wrong');
      // 즉시 시각 반영 (전체 재렌더 안함)
      const wrap = opt.closest('.wea-quiz');
      wrap.classList.add('answered');
      wrap.querySelectorAll('.opt').forEach(o => {
        const ooi = parseInt(o.dataset.oidx);
        if (ooi === learn.quiz[qi].ans) o.classList.add('correct');
        else if (ooi === oi) o.classList.add('wrong');
      });
    };
  });
}

function stopGame() {
  if (CurrentGame) {
    if (CurrentGame.cleanup) CurrentGame.cleanup();
    CurrentGame = null;
  }
}

function recordGameBest(gid, score) {
  if (!State.gameStats) State.gameStats = {};
  if (!State.gameStats[gid]) State.gameStats[gid] = { best: 0 };
  if (score > State.gameStats[gid].best) {
    State.gameStats[gid].best = score;
    saveState();
    return true;
  }
  return false;
}

// ============================================================
function startRacingGame() {
  const area = document.getElementById('gameArea');
  let html = '<div class="game-header"><div class="game-title">🏎️ レーシング</div></div>';
  html += '<div class="game-instruction">⬅️ ➡️ で 車を 動かす / 障害物に ぶつからないで!</div>';
  html += '<div class="game-hud">';
  html += '<div class="game-hud-item">📏 <span id="racingDist">0</span> m</div>';
  html += '<div class="game-hud-item">⚡ レベル <span id="racingLevel">1</span></div>';
  html += '<button class="game-back-link" id="racingExit">やめる</button>';
  html += '</div>';
  html += '<div class="game-canvas-wrap" style="width:300px;">';
  html += '<canvas id="racingCanvas" width="300" height="450" style="display:block;background:#444;"></canvas>';
  html += '</div>';
  html += '<div class="game-touch-controls" style="max-width:300px;margin-left:auto;margin-right:auto;">';
  html += '<button class="game-touch-btn" id="racingLeft">◀</button>';
  html += '<button class="game-touch-btn" id="racingRight" style="grid-column:3;">▶</button>';
  html += '</div>';
  area.innerHTML = html;

  const canvas = document.getElementById('racingCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const LANES = 3;
  const LANE_W = W / LANES;
  const CAR_W = 38, CAR_H = 60;
  const game = {
    playerLane: 1,
    playerX: LANE_W * 1 + LANE_W/2 - CAR_W/2,
    obstacles: [],  // {lane, y, color}
    distance: 0,
    speed: 4,
    level: 1,
    spawnTimer: 0,
    spawnInterval: 60,
    roadOffset: 0,
    over: false,
    raf: null,
  };
  CurrentGame = game;

  function moveLane(dir) {
    if (game.over) return;
    game.playerLane = Math.max(0, Math.min(LANES - 1, game.playerLane + dir));
    game.playerX = LANE_W * game.playerLane + LANE_W/2 - CAR_W/2;
  }

  // 키보드 + 터치
  game.keyHandler = (e) => {
    if (e.key === 'ArrowLeft') moveLane(-1);
    else if (e.key === 'ArrowRight') moveLane(1);
  };
  document.addEventListener('keydown', game.keyHandler);
  document.getElementById('racingLeft').onclick = () => moveLane(-1);
  document.getElementById('racingRight').onclick = () => moveLane(1);
  document.getElementById('racingExit').onclick = () => {
    stopGame();
    buildChapterGrid(); showPage('pageSelect');
  };

  function update() {
    if (game.over) return;
    game.distance += game.speed;
    game.roadOffset = (game.roadOffset + game.speed) % 40;
    // 레벨 업
    const newLevel = Math.floor(game.distance / 1000) + 1;
    if (newLevel > game.level) {
      game.level = newLevel;
      game.speed = Math.min(12, 4 + (newLevel - 1) * 1.2);
      game.spawnInterval = Math.max(25, 60 - (newLevel - 1) * 4);
    }
    // 장애물 생성
    game.spawnTimer++;
    if (game.spawnTimer >= game.spawnInterval) {
      game.spawnTimer = 0;
      const lane = Math.floor(Math.random() * LANES);
      const color = ['#e07b5e', '#f0c674', '#9b87bc', '#6fb074'][Math.floor(Math.random() * 4)];
      game.obstacles.push({ lane, y: -CAR_H, color });
    }
    // 장애물 이동
    game.obstacles.forEach(o => o.y += game.speed);
    // 충돌 체크
    const playerY = H - CAR_H - 20;
    game.obstacles.forEach(o => {
      const ox = LANE_W * o.lane + LANE_W/2 - CAR_W/2;
      if (o.lane === game.playerLane &&
          o.y + CAR_H > playerY &&
          o.y < playerY + CAR_H) {
        game.over = true;
      }
    });
    // 화면 밖 제거
    game.obstacles = game.obstacles.filter(o => o.y < H + CAR_H);
  }

  function draw() {
    // 배경 (도로)
    ctx.fillStyle = '#444';
    ctx.fillRect(0, 0, W, H);
    // 차선
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.setLineDash([20, 20]);
    for (let i = 1; i < LANES; i++) {
      ctx.beginPath();
      ctx.moveTo(LANE_W * i, -game.roadOffset);
      ctx.lineTo(LANE_W * i, H);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    // 가장자리 (잔디)
    ctx.fillStyle = '#2a5a2a';
    ctx.fillRect(0, 0, 6, H);
    ctx.fillRect(W - 6, 0, 6, H);
    // 장애물
    game.obstacles.forEach(o => {
      const x = LANE_W * o.lane + LANE_W/2 - CAR_W/2;
      ctx.fillStyle = o.color;
      ctx.fillRect(x, o.y, CAR_W, CAR_H);
      ctx.fillStyle = '#222';
      ctx.fillRect(x + 4, o.y + 8, CAR_W - 8, 12);
      ctx.fillRect(x + 4, o.y + CAR_H - 20, CAR_W - 8, 12);
    });
    // 플레이어
    ctx.fillStyle = '#3a7ac8';
    ctx.fillRect(game.playerX, H - CAR_H - 20, CAR_W, CAR_H);
    ctx.fillStyle = '#fff';
    ctx.fillRect(game.playerX + 4, H - CAR_H - 12, CAR_W - 8, 12);
    ctx.fillRect(game.playerX + 4, H - 32, CAR_W - 8, 12);
    // HUD 갱신
    document.getElementById('racingDist').textContent = Math.floor(game.distance / 10);
    document.getElementById('racingLevel').textContent = game.level;
    // 게임 오버 화면
    if (game.over) {
      const wrap = canvas.parentElement;
      let ov = wrap.querySelector('.game-overlay');
      if (!ov) {
        ov = document.createElement('div');
        ov.className = 'game-overlay';
        const score = Math.floor(game.distance / 10);
        const isBest = recordGameBest('racing', score);
        ov.innerHTML = '<div class="game-overlay-title">💥 GAME OVER</div>' +
          '<div class="game-overlay-score">' + score + ' m' + (isBest ? ' 🏆 NEW!' : '') + '</div>' +
          '<button class="game-overlay-btn" id="racingRetry">もう一度</button>' +
          '<button class="game-overlay-btn" id="racingMenu" style="background:#7a4a8a;margin-top:8px;">メニュー</button>';
        wrap.appendChild(ov);
        document.getElementById('racingRetry').onclick = () => tryRetryGame(startRacingGame);
        document.getElementById('racingMenu').onclick = () => { stopGame(); buildChapterGrid(); showPage('pageSelect'); };
      }
    }
  }

  function loop() {
    if (!game.over) update();
    draw();
    if (!game.over) game.raf = requestAnimationFrame(loop);
  }
  loop();

  game.cleanup = () => {
    if (game.raf) cancelAnimationFrame(game.raf);
    document.removeEventListener('keydown', game.keyHandler);
  };
}

// ============================================================
// 🧱 벽돌 깨기
// ============================================================
function startBreakerGame() {
  const area = document.getElementById('gameArea');
  let html = '<div class="game-header"><div class="game-title">🧱 ブロック崩し</div></div>';
  html += '<div class="game-instruction">⬅️ ➡️ で パドルを 動かす / 全部の ブロックを 壊そう!</div>';
  html += '<div class="game-hud">';
  html += '<div class="game-hud-item">⭐ <span id="brkScore">0</span></div>';
  html += '<div class="game-hud-item">❤️ <span id="brkLives">3</span></div>';
  html += '<div class="game-hud-item">🎯 LV<span id="brkLevel">1</span></div>';
  html += '<button class="game-back-link" id="brkExit">やめる</button>';
  html += '</div>';
  html += '<div class="game-canvas-wrap" style="width:340px;">';
  html += '<canvas id="brkCanvas" width="340" height="450" style="display:block;background:#1a1a2e;"></canvas>';
  html += '</div>';
  html += '<div class="game-touch-controls" style="max-width:340px;margin-left:auto;margin-right:auto;">';
  html += '<button class="game-touch-btn" id="brkLeft">◀</button>';
  html += '<button class="game-touch-btn" id="brkRight" style="grid-column:3;">▶</button>';
  html += '</div>';
  area.innerHTML = html;

  const canvas = document.getElementById('brkCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const game = {
    paddle: { x: W/2 - 40, y: H - 20, w: 80, h: 10 },
    ball: { x: W/2, y: H - 35, dx: 3, dy: -3, r: 6 },
    bricks: [],
    score: 0,
    lives: 3,
    level: 1,
    moving: { left: false, right: false },
    over: false, won: false,
    raf: null,
  };
  CurrentGame = game;

  function buildBricks(level) {
    const cols = 8;
    const rows = 4 + Math.min(level - 1, 3);
    const padding = 4;
    const bw = (W - (cols + 1) * padding) / cols;
    const bh = 18;
    const colors = ['#e07b5e', '#f0c674', '#6fb074', '#6ba8c4', '#9b87bc', '#c45e8e', '#5ea8c4'];
    const bricks = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        bricks.push({
          x: padding + c * (bw + padding),
          y: 30 + r * (bh + padding),
          w: bw, h: bh,
          color: colors[r % colors.length],
          alive: true,
        });
      }
    }
    return bricks;
  }
  game.bricks = buildBricks(game.level);

  game.keyDown = (e) => {
    if (e.key === 'ArrowLeft')  game.moving.left = true;
    if (e.key === 'ArrowRight') game.moving.right = true;
  };
  game.keyUp = (e) => {
    if (e.key === 'ArrowLeft')  game.moving.left = false;
    if (e.key === 'ArrowRight') game.moving.right = false;
  };
  document.addEventListener('keydown', game.keyDown);
  document.addEventListener('keyup', game.keyUp);

  // 터치 (누르고 있는 동안)
  const lBtn = document.getElementById('brkLeft');
  const rBtn = document.getElementById('brkRight');
  const onPress = (key, val) => () => { game.moving[key] = val; };
  lBtn.addEventListener('touchstart', onPress('left', true));
  lBtn.addEventListener('touchend',   onPress('left', false));
  lBtn.addEventListener('mousedown',  onPress('left', true));
  lBtn.addEventListener('mouseup',    onPress('left', false));
  lBtn.addEventListener('mouseleave', onPress('left', false));
  rBtn.addEventListener('touchstart', onPress('right', true));
  rBtn.addEventListener('touchend',   onPress('right', false));
  rBtn.addEventListener('mousedown',  onPress('right', true));
  rBtn.addEventListener('mouseup',    onPress('right', false));
  rBtn.addEventListener('mouseleave', onPress('right', false));

  document.getElementById('brkExit').onclick = () => {
    stopGame();
    buildChapterGrid(); showPage('pageSelect');
  };

  function resetBall() {
    game.ball.x = game.paddle.x + game.paddle.w/2;
    game.ball.y = game.paddle.y - 10;
    game.ball.dx = 3 * (Math.random() < 0.5 ? -1 : 1);
    game.ball.dy = -3;
  }

  function update() {
    if (game.over || game.won) return;
    // 패들
    if (game.moving.left)  game.paddle.x = Math.max(0, game.paddle.x - 6);
    if (game.moving.right) game.paddle.x = Math.min(W - game.paddle.w, game.paddle.x + 6);
    // 볼
    game.ball.x += game.ball.dx;
    game.ball.y += game.ball.dy;
    // 벽 충돌
    if (game.ball.x - game.ball.r < 0) { game.ball.x = game.ball.r; game.ball.dx *= -1; }
    if (game.ball.x + game.ball.r > W) { game.ball.x = W - game.ball.r; game.ball.dx *= -1; }
    if (game.ball.y - game.ball.r < 0) { game.ball.y = game.ball.r; game.ball.dy *= -1; }
    // 패들 충돌
    if (game.ball.y + game.ball.r >= game.paddle.y &&
        game.ball.y + game.ball.r <= game.paddle.y + game.paddle.h + 5 &&
        game.ball.x >= game.paddle.x &&
        game.ball.x <= game.paddle.x + game.paddle.w &&
        game.ball.dy > 0) {
      game.ball.dy *= -1;
      // 위치별 각도 변화
      const hitPos = (game.ball.x - game.paddle.x) / game.paddle.w; // 0..1
      game.ball.dx = (hitPos - 0.5) * 8;
    }
    // 바닥 (생명 -1)
    if (game.ball.y - game.ball.r > H) {
      game.lives--;
      if (game.lives <= 0) {
        game.over = true;
      } else {
        resetBall();
      }
    }
    // 벽돌 충돌
    game.bricks.forEach(br => {
      if (!br.alive) return;
      if (game.ball.x + game.ball.r > br.x &&
          game.ball.x - game.ball.r < br.x + br.w &&
          game.ball.y + game.ball.r > br.y &&
          game.ball.y - game.ball.r < br.y + br.h) {
        br.alive = false;
        game.score += 10;
        // 충돌 방향 (간단히 y 반사)
        game.ball.dy *= -1;
      }
    });
    // 다음 레벨
    if (game.bricks.every(b => !b.alive)) {
      game.level++;
      if (game.level > 5) {
        game.won = true;
      } else {
        game.bricks = buildBricks(game.level);
        resetBall();
        const speedUp = 1.1;
        game.ball.dx *= speedUp;
        game.ball.dy *= speedUp;
      }
    }
  }

  function draw() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);
    // 벽돌
    game.bricks.forEach(br => {
      if (!br.alive) return;
      ctx.fillStyle = br.color;
      ctx.fillRect(br.x, br.y, br.w, br.h);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(br.x, br.y, br.w, 4);
    });
    // 패들
    ctx.fillStyle = '#6ba8c4';
    ctx.fillRect(game.paddle.x, game.paddle.y, game.paddle.w, game.paddle.h);
    // 볼
    ctx.fillStyle = '#ffc850';
    ctx.beginPath();
    ctx.arc(game.ball.x, game.ball.y, game.ball.r, 0, Math.PI*2);
    ctx.fill();
    // HUD
    document.getElementById('brkScore').textContent = game.score;
    document.getElementById('brkLives').textContent = game.lives;
    document.getElementById('brkLevel').textContent = game.level;
    // 종료
    if (game.over || game.won) {
      const wrap = canvas.parentElement;
      let ov = wrap.querySelector('.game-overlay');
      if (!ov) {
        ov = document.createElement('div');
        ov.className = 'game-overlay';
        const isBest = recordGameBest('breaker', game.score);
        const title = game.won ? '🏆 ALL CLEAR!' : '💥 GAME OVER';
        ov.innerHTML = '<div class="game-overlay-title">' + title + '</div>' +
          '<div class="game-overlay-score">スコア ' + game.score + (isBest ? ' 🏆 NEW!' : '') + '</div>' +
          '<button class="game-overlay-btn" id="brkRetry">もう一度</button>' +
          '<button class="game-overlay-btn" id="brkMenu" style="background:#7a4a8a;margin-top:8px;">メニュー</button>';
        wrap.appendChild(ov);
        document.getElementById('brkRetry').onclick = () => tryRetryGame(startBreakerGame);
        document.getElementById('brkMenu').onclick = () => { stopGame(); buildChapterGrid(); showPage('pageSelect'); };
      }
    }
  }

  function loop() {
    update();
    draw();
    if (!game.over && !game.won) game.raf = requestAnimationFrame(loop);
  }
  loop();

  game.cleanup = () => {
    if (game.raf) cancelAnimationFrame(game.raf);
    document.removeEventListener('keydown', game.keyDown);
    document.removeEventListener('keyup', game.keyUp);
  };
}

// ============================================================
// 🔢 2048
// ============================================================
function start2048Game() {
  const area = document.getElementById('gameArea');
  let html = '<div class="game-header"><div class="game-title">🔢 2048</div></div>';
  html += '<div class="game-instruction">⬅️➡️⬆️⬇️ で タイルを 動かす / 同じ数字を 合体!</div>';
  html += '<div class="game-hud">';
  html += '<div class="game-hud-item">⭐ <span id="g2048Score">0</span></div>';
  html += '<div class="game-hud-item">🏆 <span id="g2048Best">0</span></div>';
  html += '<button class="game-back-link" id="g2048Exit">やめる</button>';
  html += '</div>';
  html += '<div class="game-canvas-wrap" style="width:340px;">';
  html += '<canvas id="g2048Canvas" width="340" height="340" style="display:block;background:#bbada0;"></canvas>';
  html += '</div>';
  html += '<div class="game-touch-controls" style="max-width:340px;margin-left:auto;margin-right:auto;">';
  html += '<button class="game-touch-btn" id="g2048Up" style="grid-column:2;">▲</button>';
  html += '</div>';
  html += '<div class="game-touch-controls" style="max-width:340px;margin-left:auto;margin-right:auto;">';
  html += '<button class="game-touch-btn" id="g2048Left">◀</button>';
  html += '<button class="game-touch-btn" id="g2048Down">▼</button>';
  html += '<button class="game-touch-btn" id="g2048Right">▶</button>';
  html += '</div>';
  html += '<div class="game-action-row"><button class="game-btn danger" id="g2048Restart">リスタート</button></div>';
  area.innerHTML = html;

  const canvas = document.getElementById('g2048Canvas');
  const ctx = canvas.getContext('2d');
  const SIZE = 4;
  const TILE = 80;
  const PAD = 4;
  const game = {
    grid: Array.from({length: SIZE}, () => Array(SIZE).fill(0)),
    score: 0,
    over: false, won: false,
    raf: null,
  };
  CurrentGame = game;

  const bestScore = (State.gameStats && State.gameStats['2048'] && State.gameStats['2048'].best) || 0;
  document.getElementById('g2048Best').textContent = bestScore;

  function addRandomTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (game.grid[r][c] === 0) empty.push([r, c]);
    }
    if (empty.length === 0) return false;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    game.grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    return true;
  }
  addRandomTile();
  addRandomTile();

  function slide(row) {
    // 0이 아닌 것만 모음
    const arr = row.filter(v => v !== 0);
    // 합치기
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i+1]) {
        arr[i] *= 2;
        game.score += arr[i];
        if (arr[i] === 2048) game.won = true;
        arr.splice(i+1, 1);
      }
    }
    while (arr.length < SIZE) arr.push(0);
    return arr;
  }

  function move(dir) {
    if (game.over) return false;
    const before = JSON.stringify(game.grid);
    if (dir === 'left') {
      for (let r = 0; r < SIZE; r++) game.grid[r] = slide(game.grid[r]);
    } else if (dir === 'right') {
      for (let r = 0; r < SIZE; r++) game.grid[r] = slide(game.grid[r].reverse()).reverse();
    } else if (dir === 'up') {
      for (let c = 0; c < SIZE; c++) {
        let col = [];
        for (let r = 0; r < SIZE; r++) col.push(game.grid[r][c]);
        col = slide(col);
        for (let r = 0; r < SIZE; r++) game.grid[r][c] = col[r];
      }
    } else if (dir === 'down') {
      for (let c = 0; c < SIZE; c++) {
        let col = [];
        for (let r = 0; r < SIZE; r++) col.push(game.grid[r][c]);
        col = slide(col.reverse()).reverse();
        for (let r = 0; r < SIZE; r++) game.grid[r][c] = col[r];
      }
    }
    const after = JSON.stringify(game.grid);
    if (before !== after) {
      addRandomTile();
      sfx('click');
      // 게임 오버 체크
      if (!hasMove()) game.over = true;
      return true;
    }
    return false;
  }

  function hasMove() {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (game.grid[r][c] === 0) return true;
      if (c < SIZE - 1 && game.grid[r][c] === game.grid[r][c+1]) return true;
      if (r < SIZE - 1 && game.grid[r][c] === game.grid[r+1][c]) return true;
    }
    return false;
  }

  game.keyHandler = (e) => {
    if (game.over) return;
    if (e.key === 'ArrowLeft')  { move('left');  e.preventDefault(); }
    else if (e.key === 'ArrowRight') { move('right'); e.preventDefault(); }
    else if (e.key === 'ArrowUp')    { move('up');    e.preventDefault(); }
    else if (e.key === 'ArrowDown')  { move('down');  e.preventDefault(); }
  };
  document.addEventListener('keydown', game.keyHandler);
  document.getElementById('g2048Left').onclick  = () => move('left');
  document.getElementById('g2048Right').onclick = () => move('right');
  document.getElementById('g2048Up').onclick    = () => move('up');
  document.getElementById('g2048Down').onclick  = () => move('down');
  document.getElementById('g2048Restart').onclick = () => tryRetryGame(start2048Game);
  document.getElementById('g2048Exit').onclick = () => {
    stopGame();
    buildChapterGrid(); showPage('pageSelect');
  };

  // 캔버스 스와이프
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  });
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
    touchStart = null;
  });

  function tileColor(v) {
    const map = {
      0: '#cdc1b4', 2: '#eee4da', 4: '#ede0c8', 8: '#f2b179',
      16: '#f59563', 32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72',
      256: '#edcc61', 512: '#edc850', 1024: '#edc53f', 2048: '#edc22e',
    };
    return map[v] || '#3c3a32';
  }
  function tileText(v) { return v >= 100 ? '#f9f6f2' : (v >= 8 ? '#f9f6f2' : '#776e65'); }

  function draw() {
    ctx.fillStyle = '#bbada0';
    ctx.fillRect(0, 0, 340, 340);
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const x = PAD + c * (TILE + PAD);
      const y = PAD + r * (TILE + PAD);
      const v = game.grid[r][c];
      ctx.fillStyle = tileColor(v);
      ctx.fillRect(x, y, TILE, TILE);
      if (v > 0) {
        ctx.fillStyle = tileText(v);
        ctx.font = (v >= 1000 ? '22' : v >= 100 ? '26' : '32') + "px 'RocknRoll One', sans-serif";
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(v, x + TILE/2, y + TILE/2);
      }
    }
    document.getElementById('g2048Score').textContent = game.score;
    if (game.over || game.won) {
      const wrap = canvas.parentElement;
      let ov = wrap.querySelector('.game-overlay');
      if (!ov) {
        ov = document.createElement('div');
        ov.className = 'game-overlay';
        const isBest = recordGameBest('2048', game.score);
        const title = game.won ? '🏆 2048 ACHIEVED!' : '💥 GAME OVER';
        ov.innerHTML = '<div class="game-overlay-title">' + title + '</div>' +
          '<div class="game-overlay-score">スコア ' + game.score + (isBest ? ' 🏆 NEW!' : '') + '</div>' +
          '<button class="game-overlay-btn" id="g2048Retry">もう一度</button>' +
          '<button class="game-overlay-btn" id="g2048Mn" style="background:#7a4a8a;margin-top:8px;">メニュー</button>';
        wrap.appendChild(ov);
        document.getElementById('g2048Retry').onclick = () => tryRetryGame(start2048Game);
        document.getElementById('g2048Mn').onclick = () => { stopGame(); buildChapterGrid(); showPage('pageSelect'); };
      }
    }
  }

  function loop() {
    draw();
    game.raf = requestAnimationFrame(loop);
  }
  loop();

  game.cleanup = () => {
    if (game.raf) cancelAnimationFrame(game.raf);
    document.removeEventListener('keydown', game.keyHandler);
  };
}

  const game = {
    level: 1,
    size: 11, // 미로 한 변 셀 수 (홀수)
    cellPx: 0,
    maze: null,
    px: 1, py: 1,
    gx: 0, gy: 0,
    steps: 0,
    startTime: Date.now(),
    won: false,
    raf: null,
  };
  CurrentGame = game;

  function buildMaze(size) {
    // DFS 미로 생성. size는 홀수.
    const maze = Array.from({length: size}, () => Array(size).fill(1));
    function dig(x, y) {
      maze[y][x] = 0;
      const dirs = [[2,0],[-2,0],[0,2],[0,-2]];
      for (let i = dirs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
      }
      dirs.forEach(([dx, dy]) => {
        const nx = x + dx, ny = y + dy;
        if (nx > 0 && nx < size - 1 && ny > 0 && ny < size - 1 && maze[ny][nx] === 1) {
          maze[y + dy/2][x + dx/2] = 0;
          dig(nx, ny);
        }
      });
    }
    dig(1, 1);
    return maze;
  }

  function newLevel() {
    // 레벨에 따라 미로 크기
    game.size = Math.min(11 + (game.level - 1) * 2, 21);
    if (game.size % 2 === 0) game.size++;
    game.maze = buildMaze(game.size);
    game.cellPx = Math.floor(360 / game.size);
    game.px = 1; game.py = 1;
    game.gx = game.size - 2; game.gy = game.size - 2;
    game.maze[game.gy][game.gx] = 0;
    game.steps = 0;
    game.startTime = Date.now();
    game.won = false;
    const ov = canvas.parentElement.querySelector('.game-overlay');
    if (ov) ov.remove();
  }
  newLevel();

  function move(dx, dy) {
    if (game.won) return;
    const nx = game.px + dx, ny = game.py + dy;
    if (nx < 0 || nx >= game.size || ny < 0 || ny >= game.size) return;
    if (game.maze[ny][nx] === 1) return;
    game.px = nx; game.py = ny;
    game.steps++;
    if (game.px === game.gx && game.py === game.gy) {
      game.won = true;
      sfx('chime');
    } else {
      sfx('click');
    }
  }

  game.keyHandler = (e) => {
    if (e.key === 'ArrowLeft')  { move(-1, 0); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { move(1, 0);  e.preventDefault(); }
    else if (e.key === 'ArrowUp')    { move(0, -1); e.preventDefault(); }
    else if (e.key === 'ArrowDown')  { move(0, 1);  e.preventDefault(); }
  };
  document.addEventListener('keydown', game.keyHandler);
  document.getElementById('mzLeft').onclick  = () => move(-1, 0);
  document.getElementById('mzRight').onclick = () => move(1, 0);
  document.getElementById('mzUp').onclick    = () => move(0, -1);
  document.getElementById('mzDown').onclick  = () => move(0, 1);
  document.getElementById('mzExit').onclick = () => {
    stopGame();
    buildChapterGrid(); showPage('pageSelect');
  };

  function draw() {
    const cs = game.cellPx;
    // 배경
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, 360, 360);
    // 벽
    for (let y = 0; y < game.size; y++) for (let x = 0; x < game.size; x++) {
      if (game.maze[y][x] === 1) {
        ctx.fillStyle = '#2a5a2a';
        ctx.fillRect(x * cs, y * cs, cs, cs);
      }
    }
    // 골
    ctx.fillStyle = '#ffc850';
    ctx.fillRect(game.gx * cs + 3, game.gy * cs + 3, cs - 6, cs - 6);
    ctx.fillStyle = '#2a5a2a';
    ctx.font = (cs - 6) + "px sans-serif";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🏁', game.gx * cs + cs/2, game.gy * cs + cs/2);
    // 플레이어
    ctx.fillStyle = '#3a7ac8';
    ctx.beginPath();
    ctx.arc(game.px * cs + cs/2, game.py * cs + cs/2, cs/2 - 3, 0, Math.PI*2);
    ctx.fill();
    // HUD
    const elapsed = Math.floor((Date.now() - game.startTime) / 1000);
    document.getElementById('mzTime').textContent = elapsed;
    document.getElementById('mzSteps').textContent = game.steps;
    document.getElementById('mzLevel').textContent = game.level;
    // 클리어 화면
    if (game.won) {
      const wrap = canvas.parentElement;
      let ov = wrap.querySelector('.game-overlay');
      if (!ov) {
        ov = document.createElement('div');
        ov.className = 'game-overlay';
        // 점수: 레벨×100 - 시간 - 걸음수
        const score = Math.max(0, game.level * 100 - elapsed - game.steps);
        const isBest = recordGameBest('maze', score);
        ov.innerHTML = '<div class="game-overlay-title">🏆 CLEAR!</div>' +
          '<div class="game-overlay-score">⏱ ' + elapsed + '秒 / 🚶 ' + game.steps + '歩 / スコア ' + score + (isBest ? ' 🏆 NEW!' : '') + '</div>' +
          '<button class="game-overlay-btn" id="mzNext">次の レベル →</button>' +
          '<button class="game-overlay-btn" id="mzMn" style="background:#7a4a8a;margin-top:8px;">メニュー</button>';
        wrap.appendChild(ov);
        document.getElementById('mzNext').onclick = () => {
          game.level++;
          newLevel();
        };
        document.getElementById('mzMn').onclick = () => { stopGame(); buildChapterGrid(); showPage('pageSelect'); };
      }
    }
  }

  function loop() {
    draw();
    game.raf = requestAnimationFrame(loop);
  }
  loop();

  game.cleanup = () => {
    if (game.raf) cancelAnimationFrame(game.raf);
    document.removeEventListener('keydown', game.keyHandler);
  };
}

function showEngQuestion() {
  const ch = ENG_CHAPTERS[State.engChapter];
  const q = ch.questions[State.engQIdx];
  State.engCurrentQuestion = q;
  document.getElementById('engTitle').textContent = ch.title;
  document.getElementById('engProgress').textContent = '問' + (State.engQIdx + 1) + ' / ' + ch.questions.length + ' (正解 ' + State.engCorrect + ')';

  const area = document.getElementById('engArea');
  area.innerHTML = '';

  if (q.type === 'meaning') {
    // 현재 문제에 해당하는 단어 객체 찾기 (추적용)
    const wordItem = findWordByEn(q.q) || { en: q.q, ja: q.a[q.correct] };
    let answered = false;
    const wrap = document.createElement('div');
    wrap.className = 'eng-puzzle';
    wrap.innerHTML =
      '<div class="eng-question"><div class="ja-hint">この 単語 / 熟語の 意味は?</div><span class="en">' + q.q + '</span></div>' +
      '<div class="eng-options">' +
      q.a.map((a, i) => '<button class="eng-option" data-i="' + i + '">' + a + '</button>').join('') +
      '</div>';
    area.appendChild(wrap);
    wrap.querySelectorAll('.eng-option').forEach(b => {
      b.onclick = () => {
        if (answered) return;
        const i = parseInt(b.dataset.i);
        if (i === q.correct) {
          answered = true;
          b.classList.add('correct');
          sfx('correct');
          State.engCorrect++;
          State.stats.totalCorrect++;
          markWordCorrect(wordItem);
          saveState();
          setTimeout(nextEngQ, 700);
        } else {
          b.classList.add('wrong');
          sfx('wrong');
          State.stats.totalWrong++;
          addWrongWord(wordItem);
          // 정답도 표시
          wrap.querySelectorAll('.eng-option').forEach((opt, oi) => {
            if (oi === q.correct) opt.classList.add('correct');
          });
          setTimeout(() => {
            b.classList.remove('wrong');
            wrap.querySelectorAll('.eng-option').forEach(opt => opt.classList.remove('correct'));
          }, 1200);
        }
      };
    });
  } else if (q.type === 'spell') {
    showSpellPuzzle(q);
  }
}

// 영어 단어로 단어 객체 찾기 (전체 풀에서)
function findWordByEn(en) {
  const all = [...ALL_G2, ...ALL_IDIOMS, ...G_PRE1_WORDS];
  return all.find(w => w.en === en);
}

function showSpellPuzzle(q) {
  const area = document.getElementById('engArea');
  const word = q.word;
  // 글자를 무작위로 섞어서 bank에 배치
  const shuffled = word.split('').sort(() => Math.random() - 0.5);

  const wrap = document.createElement('div');
  wrap.className = 'eng-puzzle';
  wrap.innerHTML =
    '<div class="eng-question"><div class="ja-hint">「' + q.q + '」を 英語で つづろう!</div><div style="font-size:14px;color:#888;margin-top:6px;">(' + word.length + ' letters)</div></div>' +
    '<div class="eng-spell" id="spellSlots"></div>' +
    '<div class="eng-progress" style="font-size:13px;color:#666;">↑ クリックで うしろから けせる ↓ あいているマスへ 文字を タップ</div>' +
    '<div class="spell-bank" id="spellBank"></div>' +
    '<button class="submit-btn" id="btnCheckSpell">かくにん!</button>';
  area.appendChild(wrap);

  const slots = document.getElementById('spellSlots');
  for (let i = 0; i < word.length; i++) {
    const s = document.createElement('div');
    s.className = 'spell-letter';
    s.dataset.idx = i;
    s.textContent = '';
    s.onclick = () => {
      // 마지막에 배치된 글자 제거
      const allSlots = Array.from(slots.children);
      for (let j = allSlots.length - 1; j >= 0; j--) {
        if (allSlots[j].textContent) {
          const ch = allSlots[j].textContent;
          allSlots[j].textContent = '';
          allSlots[j].classList.remove('placed');
          // bank에서 다시 활성화
          const bankBtns = document.querySelectorAll('.bank-letter');
          for (let k = 0; k < bankBtns.length; k++) {
            if (bankBtns[k].textContent === ch && bankBtns[k].classList.contains('used')) {
              bankBtns[k].classList.remove('used');
              break;
            }
          }
          sfx('click');
          return;
        }
      }
    };
    slots.appendChild(s);
  }

  const bank = document.getElementById('spellBank');
  shuffled.forEach((ch, i) => {
    const b = document.createElement('button');
    b.className = 'bank-letter';
    b.textContent = ch;
    b.onclick = () => {
      if (b.classList.contains('used')) return;
      // 다음 빈 슬롯에 배치
      const emptySlot = Array.from(slots.children).find(s => !s.textContent);
      if (emptySlot) {
        emptySlot.textContent = ch;
        emptySlot.classList.add('placed');
        b.classList.add('used');
        sfx('click');
      }
    };
    bank.appendChild(b);
  });

  document.getElementById('btnCheckSpell').onclick = () => {
    const userWord = Array.from(slots.children).map(s => s.textContent).join('');
    const wordItem = findWordByEn(word.toLowerCase()) || { en: word.toLowerCase(), ja: q.q };
    if (userWord === word) {
      sfx('correct');
      State.engCorrect++;
      State.stats.totalCorrect++;
      markWordCorrect(wordItem);
      saveState();
      Array.from(slots.children).forEach(s => s.style.background = 'var(--soft-green)');
      setTimeout(nextEngQ, 800);
    } else {
      sfx('wrong');
      State.stats.totalWrong++;
      addWrongWord(wordItem);
      showModal('😅', 'ちがうみたい','正しいスペル: ' + word, [{text:'OK', cb:() => {
        closeModal();
        Array.from(slots.children).forEach(s => { s.textContent = ''; s.classList.remove('placed'); });
        bank.querySelectorAll('.bank-letter').forEach(b => b.classList.remove('used'));
      }}], 'fail');
    }
  };
}

function nextEngQ() {
  State.engQIdx++;
  const ch = ENG_CHAPTERS[State.engChapter];
  if (State.engQIdx >= ch.questions.length) {
    finishEngChapter();
  } else {
    showEngQuestion();
  }
}

function finishEngChapter() {
  const ch = ENG_CHAPTERS[State.engChapter];
  const total = ch.questions.length;
  const score = State.engCorrect;
  const passed = score >= Math.ceil(total * 0.7);
  const perfect = score === total;
  State.stats.chaptersPlayed++;
  let earnedToken = false;  // v30: 토큰 획득 여부
  if (passed) {
    State.engCleared[State.engChapter] = true;
    if (ch.note && !State.notes.find(n => n.title === ch.note.title)) State.notes.push(ch.note);
    // v74: 첫 클리어든 복습이든 합격할 때마다 카운트, 3회마다 토큰 (반복 학습 인센티브)
    State.engClearCount = (State.engClearCount || 0) + 1;
    if (State.engClearCount % 3 === 0) {
      State.gameTokens = (State.gameTokens || 0) + 1;
      earnedToken = true;
    }
  }
  saveState();
  sfx('chime');
  triggerConfetti();
  const stars = perfect ? '⭐⭐⭐' : score >= total * 0.85 ? '⭐⭐' : score >= total * 0.7 ? '⭐' : '';
  const icon = perfect ? '🏆' : passed ? '🎉' : '💪';
  const msg = perfect
    ? 'パーフェクト!すごい!\nぜんぶ せいかい!'
    : passed
    ? 'よくできました!\nもう一度 ちょうせんしたら パーフェクト ねらえそう!'
    : 'おしい!もう一度 ちょうせんしてみよう!';
  const wrongCount = Object.keys(State.wrongWords).length;
  const reviewMsg = wrongCount >= 4 ? '\n\n📝 復習チャレンジに ' + wrongCount + '個の 単語が あります!' : '';
  // v30: 게임 토큰 메시지
  let tokenMsg = '';
  if (earnedToken) {
    tokenMsg = '\n\n🎮 ゲームトークン GET! (現在 ' + State.gameTokens + '個)';
  } else if (passed && State.engCleared[State.engChapter]) {
    const remaining = 3 - ((State.engClearCount || 0) % 3);
    if (remaining < 3 && remaining > 0 && State.engClearCount > 0) {
      tokenMsg = '\n\n🎮 あと ' + remaining + ' 章 クリアで ゲームトークン!';
    }
  }
  showModal(
    icon,
    ch.title + ' 終了!',
    stars + (stars ? '\n\n' : '') + '正解 ' + score + ' / ' + total + '問\n\n' + msg + reviewMsg + tokenMsg,
    [
      {text:'もう一度', cb:() => { closeModal(); startEngChapter(State.engChapter); }},
      {text:'もくじへ', cb:() => { closeModal(); buildChapterGrid(); showPage('pageSelect'); }},
    ], passed ? 'success' : 'fail'
  );
}

function showModal(icon, title, text, buttons, cls) {
  document.getElementById('modalIcon').textContent = icon;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  const m = document.getElementById('modal');
  m.className = 'modal' + (cls ? ' ' + cls : '');
  const btns = document.getElementById('modalButtons');
  btns.innerHTML = '';
  buttons.forEach((b, i) => {
    const btn = document.createElement('button');
    btn.className = 'modal-btn' + (i > 0 ? ' secondary' : '');
    btn.textContent = b.text;
    btn.onclick = b.cb;
    btns.appendChild(btn);
  });
  document.getElementById('modalBg').classList.add('active');
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('active');
}

function triggerConfetti() {
  const c = document.getElementById('confetti');
  c.innerHTML = '';
  const colors = ['#e07b5e','#6ba8c4','#f0c674','#9b87bc','#6fb074'];
  for (let i = 0; i < 35; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = (Math.random() * 0.4) + 's';
    p.style.animationDuration = (2 + Math.random() * 1.5) + 's';
    c.appendChild(p);
  }
  setTimeout(() => c.innerHTML = '', 3500);
}

(function migrateTokensV30() {
  if ((State.engClearCount || 0) === 0) {
    const alreadyCleared = State.engCleared.filter(c => c).length;
    if (alreadyCleared > 0) {
      // 기존 클리어 수를 카운트로 변환, 토큰도 부여

      State.gameTokens = (State.gameTokens || 0) + earnedTokens;
      saveState();
    }
  }
})();
